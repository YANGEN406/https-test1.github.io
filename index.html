    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#595666',
                        secondary: '#8A8799',
                        light: '#F3F2F7',
                        dark: '#3A3847'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }

    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 10px 30px rgba(89, 86, 102, 0.08);
            }
            .option-item {
                transition: all 0.25s ease;
            }
            .option-item:hover {
                @apply bg-primary/10;
            }
            .option-item.active {
                @apply bg-primary text-white;
            }

                animation: fadeIn 0.4s ease forwards;

</head>

                    <label data-i18n="labelRealAge" class="block text-sm mb-2">请输入你的实际年龄</label>

                           class="w-full border border-secondary/30 rounded-lg px-4 py-3 outline-none focus:border-primary transition">
                </div>
                <button onclick="startTest()" data-i18n="btnStart"
                        class="w-full bg-primary text-white py-3 rounded-lg hover:bg-dark transition">
                    开始测试
                </button>
                <p data-i18n="tipDisclaimer" class="text-xs text-secondary mt-6 text-center">温馨提示：本测试仅为趣味参考，不能替代专业心理评估</p>
            </div>
        </div>

        <!-- 测试题目页 -->
        <div id="page-questions" class="hidden fade-in">
            <div class="bg-white rounded-2xl p-6 md:p-8 card-shadow">
                <div class="flex justify-between items-center mb-6">
                    <span data-i18n="labelQNo" class="text-sm text-secondary">题目 <span id="currentNo">1</span> / 30</span>
                    <div class="h-1 w-28 bg-light rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-primary w-[3.33%] transition-all"></div>
                    </div>
                </div>
                <h2 id="questionTitle" class="text-lg md:text-xl font-medium mb-6"></h2>
                <div id="optionBox" class="space-y-3"></div>
                <div class="flex gap-3 mt-8">
                    <button onclick="prevQuestion()" id="btnPrev" data-i18n="btnPrev"
                            class="w-1/2 py-3 rounded-lg border border-secondary/40 hover:bg-light transition">上一题</button>
                    <button onclick="nextQuestion()" data-i18n="btnNext"
                            class="w-1/2 bg-primary text-white py-3 rounded-lg hover:bg-dark transition">下一题</button>
                </div>
            </div>
        </div>

        <!-- 结果页 -->
        <div id="page-result" class="hidden fade-in">
            <div class="bg-white rounded-2xl p-6 md:p-8 card-shadow">
                <h2 data-i18n="resultHead" class="text-xl font-medium text-primary text-center mb-2">你的测试结果</h2>
                <div class="text-center my-8">
                    <div class="inline-block rounded-full bg-primary/10 px-8 py-6">
                        <p data-i18n="labelMentalAge" class="text-sm text-secondary">心理年龄</p>
                        <p id="mentalAgeResult" class="text-4xl font-medium text-primary mt-1">--</p>
                    </div>
                </div>
                <div id="diffInfo" class="mb-6 text-center"></div>
                <div class="border-t border-secondary/20 pt-6">

                    <div id="analysisText" class="text-secondary text-sm leading-relaxed space-y-3"></div>
                </div>
                <!-- 分享区域 -->
                <div class="mt-6 pt-6 border-t border-secondary/20">
                    <p data-i18n="shareTip" class="text-sm mb-3">分享你的测试结果</p>
                    <div class="flex gap-2">

                    </div>
                    <p id="copySuccess" data-i18n="copyOk" class="hidden text-green-600 text-xs mt-2">已复制链接！</p>

        let lang = "zh";
        let currentIndex = 0;
        let answerArr = Array(questionList.length).fill(null);
        let realAgeVal = 0;
        let totalScoreCache = 0;

        // 切换语言
        function switchLang(){
            lang = document.getElementById("langSelect").value;
            renderI18n();
            if(!document.getElementById("page-start").classList.contains("hidden")) return;
            if(!document.getElementById("page-questions").classList.contains("hidden")){
                renderQuestion();
            }else{
                calcResultByCache();
            }
        }
        function renderI18n(){
            document.querySelectorAll("[data-i18n]").forEach(el=>{
                const k = el.getAttribute("data-i18n");
                if(i18n[lang][k]) el.innerText = i18n[lang][k];
            })
        }

        function showPage(id) {
            document.querySelectorAll("#page-start,#page-questions,#page-result").forEach(el=>el.classList.add("hidden"));
            document.getElementById(id).classList.remove("hidden");
        }

        function startTest(){
            const val = Number(document.getElementById("realAge").value);
            if(!val || val<10 || val>90){
                alert(i18n[lang].alertAge);
                return;
            }
            realAgeVal = val;
            currentIndex = 0;
            renderQuestion();
            showPage("page-questions");
        }

        function renderQuestion(){
            const item = questionList[currentIndex];
            document.getElementById("currentNo").innerText = currentIndex+1;
            document.getElementById("questionTitle").innerText = item.q[lang];
            const box = document.getElementById("optionBox");
            box.innerHTML = "";
            item.o.forEach((opt,idx)=>{
                const div = document.createElement("div");
                div.className = "option-item rounded-lg border border-secondary/30 px-4 py-3 cursor-pointer";
                if(answerArr[currentIndex] === idx) div.classList.add("active");
                div.innerText = opt[lang];
                div.onclick = ()=>{
                    answerArr[currentIndex] = idx;
                    renderQuestion();
                }
                box.appendChild(div);
            })
            const pct = ((currentIndex+1)/30)*100;
            document.getElementById("progressBar").style.width = pct+"%";
            document.getElementById("btnPrev").style.visibility = currentIndex===0 ? "hidden" : "visible";
        }

        function prevQuestion(){
            if(currentIndex>0){
                currentIndex--;
                renderQuestion();
            }
        }
        function nextQuestion(){
            if(answerArr[currentIndex] === null){
                alert(i18n[lang].alertSelectOpt);
                return;
            }
            if(currentIndex < questionList.length -1){
                currentIndex++;
                renderQuestion();
            }else{
                calcResult();
            }
        }

        function calcResult(){
            let totalScore = 0;
            for(let i=0;i<30;i++){
                const s = questionList[i].s[answerArr[i]];
                totalScore += s;
            }
            totalScoreCache = totalScore;
            renderResult(totalScore, realAgeVal);
            // 生成分享链接，hash参数 #s=分数&a=年龄
            const shareUrl = location.origin + location.pathname + `#s=${totalScore}&a=${realAgeVal}`;
            document.getElementById("shareLink").value = shareUrl;
        }
        function calcResultByCache(){
            renderResult(totalScoreCache, realAgeVal);
        }

        function renderResult(totalScore, ra){
            const mentalAge = Math.round(12 + (totalScore / 180) * (75 - 12));
            const diff = mentalAge - ra;
            document.getElementById("mentalAgeResult").innerText = mentalAge;

            let diffHtml = "";
            let analysisHtml = "";
            if(diff >= 8){
                diffHtml = `<p class="text-secondary">${i18n[lang].diffMature.replace("{n}", diff)}</p>`;
                analysisHtml = i18n[lang].anaMature;
            }else if(diff >= -7 && diff <=7){
                diffHtml = `<p class="text-secondary">${i18n[lang].diffSame.replace("{n}", diff)}</p>`;
                analysisHtml = i18n[lang].anaSame;
            }else{
                diffHtml = `<p class="text-secondary">${i18n[lang].diffYoung.replace("{n}", Math.abs(diff))}</p>`;
                analysisHtml = i18n[lang].anaYoung;
            }
            document.getElementById("diffInfo").innerHTML = diffHtml;
            document.getElementById("analysisText").innerHTML = analysisHtml;
            showPage("page-result");
        }

        async function copyShareLink(){
            const input = document.getElementById("shareLink");
            try{
                await navigator.clipboard.writeText(input.value);
                document.getElementById("copySuccess").classList.remove("hidden");
                setTimeout(()=>document.getElementById("copySuccess").classList.add("hidden"),2000);
            }catch(e){
                input.select();
            }
        }

        function resetAll(){
            answerArr = Array(questionList.length).fill(null);
            currentIndex = 0;
            document.getElementById("realAge").value = "";
            history.pushState("", document.title, location.pathname);
            showPage("page-start");
        }

        // 页面加载：检测分享hash链接
        window.onload = function(){
            renderI18n();
            const hash = location.hash.slice(1);
            if(hash){
                const params = new URLSearchParams(hash);
                const s = params.get("s");
                const a = params.get("a");
                if(s && a){
                    totalScoreCache = Number(s);
                    realAgeVal = Number(a);
                    calcResultByCache();
                    const shareUrl = location.origin + location.pathname + `#s=${s}&a=${a}`;
                    document.getElementById("shareLink").value = shareUrl;
                }
            }
        }
    </script>
